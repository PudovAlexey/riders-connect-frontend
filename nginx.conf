# Serves the built SPA and reverse-proxies the API + WebSocket to the backend
# container (`app`) on the same docker network. Single origin → no CORS needed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;          # allow media uploads

    # Pure backend endpoints / assets that must be served by the backend even on
    # a direct browser hit (uploaded media opened in a new tab, health checks).
    # These prefixes are NOT client-side routes, so navigations can't land here.
    location ~ ^/(geo|points|media|uploads|health)(/|$) {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API prefixes that COLLIDE with client-side SPA routes (/chat, /profile, …).
    # On a full reload / deep link the browser requests the *document* for that
    # path; without this guard nginx proxies it to the backend, which answers 401
    # and the user sees a raw "unauthorized" page instead of the app. So: browser
    # navigations (Accept: text/html) get the SPA shell, while XHR/fetch API calls
    # (Accept: application/json — never text/html) are proxied as normal. Mirrors
    # the dev-server guard in vite.config.ts.
    location ~ ^/(auth|profile|chat|events|contacts|garage)(/|$) {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (chat + live locations)
    location /ws {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — every other path returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
